<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>えいたんレーダー</title>
<style>
  :root {
    color-scheme: light;
    /* 学習記録アプリの設計書と同じ配色 */
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f9; --ink:#1e3a5f; --ink2:#475569; --ink3:#94a3b8;
    --line:#dde3f0; --primary:#3b5bdb; --primary-ink:#ffffff;
    --good:#2f9e44; --warn:#e67700; --bad:#c92a2a; --good-bg:#ecfdf3; --bad-bg:#fff1f1;
    --lv5:#2f9e44; --lv4:#3b5bdb; --lv3:#e67700; --lv25:#6741d9; --lv2:#d6336c; --lv15:#0b7285;
    --hs:85%; --hl:82%; --heat-ink:#1e3a5f;
  }
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after { box-sizing:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
    font-family:'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',system-ui,sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
  .wrap { max-width:480px; margin:0 auto; padding:14px 16px 120px; }
  h1 { font-size:22px; margin:6px 0 2px; line-height:1.3; }
  h2 { font-size:16px; margin:26px 0 10px; }
  .sub { color:var(--ink2); font-size:13px; margin:0; }
  body.gate .tabbar { display:none; }
  .mock { display:flex; gap:8px; align-items:center; background:var(--surface2); color:var(--ink2);
    border-radius:10px; padding:8px 12px; font-size:12px; margin-bottom:14px; }

  /* hero */
  .hero { background:var(--primary); color:var(--primary-ink); border-radius:22px; padding:20px 20px 18px; margin:12px 0 4px; }
  .hero small { opacity:.85; font-size:13px; }
  .hero .big { font-size:30px; font-weight:800; line-height:1.25; margin:4px 0 2px; letter-spacing:.02em; }
  .hero .pct { font-size:13px; opacity:.9; margin-bottom:16px; }
  .btn { display:block; width:100%; min-height:52px; border-radius:16px; font-weight:800; font-size:16px; padding:12px 16px; text-align:center; }
  .btn-light { background:var(--primary-ink); color:var(--primary); }
  .btn-main { background:var(--primary); color:var(--primary-ink); }
  .btn-sub { background:var(--surface2); color:var(--ink); }
  .row2 { display:flex; gap:10px; }
  .row2 > * { flex:1; }

  .stat { display:flex; gap:10px; margin:12px 0 0; }
  .stat div { flex:1; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 14px; }
  .stat b { font-size:24px; font-variant-numeric:tabular-nums; display:block; line-height:1.2; }
  .stat span { font-size:12px; color:var(--ink2); }

  /* level bars */
  .lv { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .lv-name { width:58px; font-weight:800; }
  .bar { flex:1; height:12px; background:var(--surface2); border-radius:8px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:8px; }
  .lv-n { width:58px; text-align:right; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums; }

  /* word rows */
  .list { background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .wr { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .wr:last-child { border-bottom:0; }
  .wr .w { flex:1; min-width:0; }
  .wr .en { font-weight:800; font-size:16px; overflow-wrap:anywhere; }
  .wr .ja { font-size:13px; color:var(--ink2); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:0 7px; border-radius:6px; margin-right:4px; color:#fff; vertical-align:1px; }
  .tag.l5 { background:var(--lv5); } .tag.l4 { background:var(--lv4); } .tag.l3 { background:var(--lv3); } .tag.l25 { background:var(--lv25); } .tag.l2 { background:var(--lv2); } .tag.l15 { background:var(--lv15); }
  .spk { width:40px; height:40px; border-radius:50%; background:var(--surface2); font-size:18px; flex-shrink:0; }
  .dots { display:flex; gap:3px; margin-top:4px; }
  .dots i { width:14px; height:6px; border-radius:3px; background:var(--surface2); }
  .dots i.h { background:hsl(var(--h) var(--hs) calc(var(--hl) - 18%)); }
  .dots i.n { background:var(--line); }

  /* segmented / chips */
  .seg { display:flex; background:var(--surface2); border-radius:12px; padding:3px; gap:2px; overflow-x:auto; }
  .seg button { flex:1 0 auto; white-space:nowrap; padding:8px 12px; border-radius:10px; font-weight:700; font-size:13px; color:var(--ink2); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:9px 15px; border-radius:20px; background:var(--surface); border:1.5px solid var(--line); font-weight:700; font-size:14px; color:var(--ink2); }
  .chip.on { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .field { margin:0 0 18px; }
  .field > label { display:block; font-weight:800; margin-bottom:8px; font-size:14px; }

  /* heatmap */
  .heat { display:grid; grid-template-columns:5.4em repeat(3,1fr); gap:6px; margin-top:10px; align-items:center; }
  .heat .hd { font-size:12px; font-weight:800; text-align:center; color:var(--ink2); }
  .heat .rl { font-size:12.5px; font-weight:700; }
  .cell { height:46px; border-radius:12px; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;
    background:hsl(var(--h) var(--hs) var(--hl)); color:var(--heat-ink); }
  .cell.none { background:var(--surface2); color:var(--ink3); font-weight:600; }
  .legend { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2); margin-top:12px; }
  .legend i { flex:1; height:10px; border-radius:6px;
    background:linear-gradient(90deg,hsl(4 var(--hs) var(--hl)),hsl(50 var(--hs) var(--hl)),hsl(130 var(--hs) var(--hl))); }
  .insight { background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--bad); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:14px; }
  .insight b { font-weight:800; }
  .pbar { display:flex; align-items:center; gap:10px; margin:8px 0; font-size:14px; }
  .pbar .n { width:76px; font-weight:700; }
  .pbar .v { width:42px; text-align:right; font-variant-numeric:tabular-nums; font-weight:800; }



  /* roadmap */
  .road { margin-top:16px; }
  .rd { display:grid; grid-template-columns:44px 1fr; gap:10px; position:relative; padding-bottom:16px; }
  .rd::before { content:''; position:absolute; left:20px; top:34px; bottom:-8px; width:4px; background:var(--line); border-radius:2px; }
  .rd.last::before { display:none; }
  .rd.trav::before { background:var(--good); }
  .node { width:44px; height:44px; border-radius:50%; background:var(--surface2); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; z-index:1; }
  .node.done { background:var(--good); border-color:var(--good); color:#fff; }
  .node.cur { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); box-shadow:0 0 0 5px var(--surface2); }
  .rc { background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:18px; padding:13px 14px; }
  .rc.cur { border:2px solid var(--primary); border-left:6px solid var(--c); }
  .rc.lock { opacity:.62; }
  .rc .ttl { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .rc .ttl b { font-size:20px; color:var(--c); }
  .rc .ttl span { font-size:12.5px; color:var(--ink2); }
  .gate { position:relative; height:14px; background:var(--surface2); border-radius:8px; margin-top:12px; }
  .gate i { display:block; height:100%; border-radius:8px; background:var(--c); }
  .gate b { position:absolute; top:-4px; bottom:-4px; left:90%; width:3px; background:var(--ink); border-radius:2px; }
  .gl { display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink2); margin:4px 0 6px; font-variant-numeric:tabular-nums; }
  .stages { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
  .stg { padding:6px 11px; border-radius:14px; background:var(--surface2); border:1.5px solid var(--line); font-weight:700; font-size:13px; }
  .stg small { color:var(--ink3); font-weight:600; }
  .stg.ok { border-color:var(--good); color:var(--good); }
  .need { font-size:13px; color:var(--ink2); margin:2px 0 10px; }
  .curcard { display:block; width:100%; text-align:left; background:var(--surface); border:2px solid var(--primary); border-radius:18px; padding:12px 14px; margin-top:12px; }


  /* weekly report */
  #rep { position:fixed; inset:0; background:var(--bg); z-index:55; overflow:auto;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); display:none; }
  #rep.open { display:block; }
  .repbox { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:14px; }
  .repbox h3 { margin:0 0 4px; font-size:16px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .kpi { background:var(--surface2); border-radius:14px; padding:10px 12px; }
  .kpi b { font-size:26px; display:block; line-height:1.2; font-variant-numeric:tabular-nums; }
  .kpi span { font-size:12px; color:var(--ink2); }
  .kpi em { display:block; font-style:normal; font-size:12px; font-weight:800; }
  .up { color:var(--good); } .down { color:var(--bad); } .flat { color:var(--ink3); }
  .days { display:flex; gap:6px; align-items:flex-end; height:120px; margin-top:12px; }
  .days > div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:11px; color:var(--ink2); gap:3px; font-variant-numeric:tabular-nums; }
  .days i { display:block; width:100%; border-radius:6px 6px 0 0; background:var(--primary); min-height:4px; }
  .days i.z { background:var(--line); }
  .fld { width:100%; font:inherit; font-size:16px; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); }
  .lbl { display:block; font-weight:800; font-size:13px; margin:14px 0 6px; }
  .subj { background:var(--surface2); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--ink2); margin-top:10px; }
  .kidmsg { background:var(--good-bg); border-radius:14px; padding:10px 14px; font-weight:700; margin-top:10px; }

  /* AI analysis */
  .ai { background:var(--surface); border:2px solid var(--primary); border-radius:20px; padding:16px; margin-top:18px; }
  .ai h3 { margin:0 0 4px; font-size:16px; }
  .ai .hl { font-size:18px; font-weight:800; line-height:1.4; margin:10px 0 6px; }
  .ai .blk { margin-top:14px; }
  .ai .blk > b { display:block; font-size:13px; color:var(--ink2); margin-bottom:6px; }
  .ai .wk { background:var(--surface2); border-radius:14px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  .ai .wk .tg { display:inline-block; font-size:12px; font-weight:800; background:var(--bad); color:#fff; border-radius:6px; padding:0 8px; margin-bottom:4px; }
  .ai .wk .tp { color:var(--ink2); margin-top:2px; }
  .ai ul { margin:0; padding-left:1.2em; font-size:14px; }
  .ai .plan { display:block; width:100%; text-align:left; background:var(--primary); color:var(--primary-ink); border-radius:14px; padding:11px 14px; margin-bottom:8px; font-weight:700; font-size:14px; }
  .ai .plan small { display:block; font-weight:500; opacity:.9; font-size:12.5px; }
  .ai .kid { background:var(--good-bg); border-radius:14px; padding:10px 14px; font-weight:700; }
  .ai .note { font-size:12px; color:var(--ink3); margin-top:12px; }
  .ai .stale { font-size:12.5px; color:var(--warn); margin-top:10px; }

  /* tab bar */
  .tabbar { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
  .tabbar div { max-width:480px; margin:0 auto; display:flex; }
  .tabbar button { flex:1; padding:9px 0 8px; font-size:11px; font-weight:700; color:var(--ink3); display:flex; flex-direction:column; align-items:center; gap:1px; }
  .tabbar button span { font-size:21px; line-height:1.2; }
  .tabbar button.on { color:var(--primary); }

  /* quiz overlay */
  #quiz { position:fixed; inset:0; background:var(--bg); z-index:50; overflow:auto;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); display:none; }
  #quiz.open { display:block; }
  .qtop { display:flex; align-items:center; gap:12px; padding:12px 16px 4px; max-width:480px; margin:0 auto; }
  .qx { width:40px; height:40px; border-radius:50%; background:var(--surface2); font-size:18px; }
  .qprog { flex:1; height:12px; background:var(--surface2); border-radius:8px; overflow:hidden; }
  .qprog i { display:block; height:100%; background:var(--primary); border-radius:8px; transition:width .3s; }
  .qn { font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums; width:44px; text-align:right; }
  .qbody { max-width:480px; margin:0 auto; padding:14px 16px 40px; }
  .qmode { font-size:13px; font-weight:700; color:var(--ink2); }
  .qcard { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:26px 18px; text-align:center; margin:8px 0 16px; }
  .qcard .q { font-size:32px; font-weight:800; line-height:1.3; overflow-wrap:anywhere; }
  .qcard .qj { font-size:26px; font-weight:800; line-height:1.4; }
  .qcard .pat { font-size:20px; letter-spacing:.14em; color:var(--ink3); margin-top:10px; word-break:break-all; font-variant-numeric:tabular-nums; }
  .qplay { width:76px; height:76px; border-radius:50%; background:var(--primary); color:var(--primary-ink); font-size:32px; }
  .qplay.s { width:44px; height:44px; font-size:20px; background:var(--surface2); color:var(--ink); margin-top:10px; }
  .ch { display:block; width:100%; min-height:58px; margin-bottom:10px; padding:12px 16px; border-radius:16px; background:var(--surface);
    border:2px solid var(--line); font-weight:700; font-size:17px; text-align:left; }
  .ch.ok { background:var(--good-bg); border-color:var(--good); }
  .ch.ng { background:var(--bad-bg); border-color:var(--bad); }
  .ch[disabled] { cursor:default; }
  .inp { width:100%; font:inherit; font-size:22px; font-weight:700; padding:14px 16px; border-radius:16px; border:2px solid var(--line);
    background:var(--surface); color:var(--ink); margin-bottom:10px; }
  .qcard .qex { font-size:21px; font-weight:700; line-height:1.55; overflow-wrap:anywhere; }
  .qcard .qex b { color:var(--primary); }
  .qcard .qexj { font-size:14px; color:var(--ink2); margin-top:8px; }
  .exb { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:15px; }
  .exb b { color:var(--primary); }
  .tiles { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 14px; }
  .tile { min-width:44px; min-height:48px; padding:6px 12px; border-radius:12px; font-size:20px; font-weight:800; line-height:1.2;
    background:var(--surface); border:2px solid var(--line); color:var(--ink); }
  .tile.slot { background:var(--surface2); border-style:dashed; }
  .tile.on { border-color:var(--primary); }
  .tile.used { opacity:.25; }
  .tile.ok { background:var(--good-bg); border-color:var(--good); }
  .tile.ng { background:var(--bad-bg); border-color:var(--bad); }
  .tiles.ans { padding:12px 8px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .fb { border-radius:16px; padding:14px 16px; margin:4px 0 12px; }
  .fb.ok { background:var(--good-bg); } .fb.ng { background:var(--bad-bg); }
  .fb .t { font-weight:800; font-size:17px; }
  .fb .a { font-size:20px; font-weight:800; margin-top:4px; overflow-wrap:anywhere; }
  .score { font-size:56px; font-weight:800; text-align:center; line-height:1.1; margin:18px 0 0; font-variant-numeric:tabular-nums; }
  .score small { font-size:22px; color:var(--ink2); }

  /* sheet */
  #bd { position:fixed; inset:0; background:rgba(8,12,24,.5); z-index:60; display:none; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--bg); border-radius:24px 24px 0 0;
    max-height:82%; overflow:auto; padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:none; }
  #sheet .in { max-width:480px; margin:0 auto; }
  #sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 12px; }
  body.sheet-open #bd, body.sheet-open #sheet { display:block; }
  .empty { text-align:center; color:var(--ink2); padding:24px 8px; font-size:14px; }
  @media (prefers-reduced-motion: reduce) { .qprog i { transition:none; } }
</style>
</head>

<div id="sheet"><div class="in" id="sheetIn"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 設定 ============ */
// anon キーは公開前提のキー（RLS で守る）。service_role は絶対にここへ書かない。
const SUPABASE_URL = 'https://otorkvmcnhwspjwypurb.supabase.co';

const FEATURES = { ai:false, report:true, line:false };
// ★ push のたびに、sw.js の CACHE_VERSION と一緒に上げる（ホームのタイトル右に表示）
const APP_VERSION = 'v8', APP_DATE = '2026-10-08';

/* ============ データ ============ */
const MODES = { en2ja:'英→和', ja2en:'和→英', spell:'スペル' };
const TYPES = { word:'単語', phrase:'熟語', idiom:'イディオム' };
const THEME_ORDER = ['たべもの','どうぶつ','かぞく・ひと','からだ','がっこう','ばしょ','もの','あそび・スポーツ','しぜん・てんき','じかん','かず','いろ・ようす','きもち','うごき','ことば','かいわ'];
let THEMES = [];   // vocab_items の theme から起動時に作る
// 級の順番（下から上へ進む）。内部は数値：25=準2級(p2), 15=準1級(p1)
const LVORD = [5,4,3,25,2,15];
const LVN = {5:'5級',4:'4級',3:'3級',25:'準2級',2:'2級',15:'準1級'};

const LV_FROM_DB = {'5':5,'4':4,'3':3,'p2':25,'2':2,'p1':15};
const GATE = 0.9;
// 級ごとに「全語を何回正解したらクリアか」。SQL の level_req と同じ値にすること
const REQ = {5:1,4:1,3:1,25:2,2:2,15:2};
const REQTXT = '5〜3級は全語を1回、準2級〜準1級は全語を2回';
let D = [];        // vocab_items（active）を {id,en,ja,lv,type,theme} にしたもの
const byId = id => D.find(d=>d.id===id);

/* ============ 状態 ============ */
let sb = null, USER = null, CHILD = null;
let PENDING = [];  // 保存に失敗した回答セッション（再送用）
let S = { stats:{}, recent:[], today:0, cleared:{}, sessions:[], report:repDef() };
let UI = { tab:'home', lv:'all', wlv:'all', wtype:'all' };
let C = { lv:[5,4], types:['word','phrase','idiom'], mode:'mix', prio:'weak', n:10 };
let Q = null;
function save(){}  // 週間レポート画面（FEATURES.report=false で非表示）用。Phase 2 で置き換える

/* ============ 集計 ============ */
const st = (id,m) => (S.stats[id] && S.stats[id][m]) || {s:0,c:0};
function itemAgg(id){ let s=0,c=0; for(const m in MODES){ const x=st(id,m); s+=x.s; c+=x.c; } return {s,c}; }
const accOf = x => x.s ? x.c/x.s : null;
const filt = lv => D.filter(d => lv==='all' || d.lv==lv);
function cellAgg(theme, mode, lv){
  let s=0,c=0;
  for(const d of filt(lv)){ if(theme && d.theme!==theme) continue; const x=st(d.id,mode); s+=x.s; c+=x.c; }
  return {s,c};
}
function weakestCell(lv){
  let best=null;
  for(const t of THEMES) for(const m in MODES){
    const x = cellAgg(t,m,lv); if(x.s<6) continue;
    const a = x.c/x.s; if(!best || a<best.a) best = {t,m,a,s:x.s};
  }
  return best;
}
const pct = a => Math.round(a*100);
const heat = a => `--h:${Math.round(4+a*126)}`;
// 「おぼえた」＝その級のクリア条件の正解回数（REQ）に届いた語
const mastered = d => itemAgg(d.id).c >= REQ[d.lv];
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85; speechSynthesis.speak(u); }catch(e){}
}
const speakId = id => speak(byId(id).en);


/* ============ ロードマップ判定 ============ */
function lvStat(l){
  const it = D.filter(d=>d.lv===l); let s=0,c=0,done=0;
  it.forEach(d=>{ const x=itemAgg(d.id); s+=x.s; c+=x.c; if(x.c>=REQ[l]) done++; });
  return { n:it.length, s, done, acc:s?c/s:0 };
}
function stageStat(l,t){
  const it = D.filter(d=>d.lv===l && d.theme===t); let s=0,c=0,done=0;
  it.forEach(d=>{ const x=itemAgg(d.id); s+=x.s; c+=x.c; if(x.c>=REQ[l]) done++; });
  return { n:it.length, acc:s?c/s:0, ok: it.length>0 && done===it.length && s>0 && c/s>=GATE };
}
// 一度でもまちがえたことがある語（あとで正解しても外れない）
function everWrong(d){ const x = itemAgg(d.id); return x.s > x.c;
}
function curLv(){ for(const l of LVORD) if(!(S.cleared&&S.cleared[l])) return l; return null; }
const isOpen = l => !!((S.cleared&&S.cleared[l]) || l===curLv());

    const x=st(id,m); return x.s ? `<i class="h" style="${heat(x.c/x.s)}"></i>` : `<i class="n"></i>`;
  }).join('')}</div>`;
}
function wordRow(d, onclick){

}

/* ============ クイズ ============ */
function practiceCell(t,m,lv){
  closeSheet();
  const pool = filt(lv).filter(d=>d.theme===t && isOpen(d.lv));
  if(!pool.length) return;
  startQuiz(pool,{mode:m,n:Math.min(10,pool.length),prio:'weak'});
}
function practicePool(){
  let pool = D.filter(d=>C.lv.includes(d.lv) && isOpen(d.lv) && C.types.includes(d.type));
  if(!pool.length) pool = D.filter(d=>isOpen(d.lv) && C.types.includes(d.type));
  return pool;
}
function startFromConfig(){
  let pool = practicePool(), prio = C.prio;
  if(prio==='new'){ const nw = pool.filter(d=>!itemAgg(d.id).s); if(nw.length>=3) pool = nw; }
  if(prio==='miss'){ pool = pool.filter(everWrong); prio = 'weak'; }
  if(!pool.length) return;
  startQuiz(pool,{mode:C.mode,n:Math.min(C.n,pool.length),prio});
}
// ロードマップの「まちがえた語テスト」：その級で一度でもまちがえた語から最大20問
function startMiss(l){ const pool = D.filter(d=>d.lv===l && everWrong(d)); if(pool.length) startQuiz(pool,{mode:'mix',n:Math.min(20,pool.length),prio:'weak'}); }
function missBtn(l){
  const n = D.filter(d=>d.lv===l && everWrong(d)).length;
  return n ? `<button class="btn btn-sub" style="min-height:44px;padding:8px;margin-top:8px" onclick="startMiss(${l})">まちがえた語テスト（${n}語）</button>` : '';
}
function wpick(arr, wf){
  const w = arr.map(wf), tot = w.reduce((a,b)=>a+b,0); let r = Math.random()*tot;
  for(let i=0;i<arr.length;i++){ r-=w[i]; if(r<=0) return i; } return arr.length-1;
}
// 例文（[[ ]] で囲んだ部分が覚える語句）。熟語・会話表現にだけある
const exSpan = d => { const m = (d.ex||'').match(/\[\[(.+?)\]\]/); return m ? m[1] : null; };
const exHtml = (s, blank) => esc(s||'').replace(/\[\[(.+?)\]\]/, (_,x)=> blank ? x.split(' ').map(()=>'＿＿').join(' ') : `<b>${x}</b>`);
// スペル（並び替え）に出せるか：例文があれば例文の語句、なければ英語表記で判定
const canSpell = d => { const t = exSpan(d) || d.en; return t.length<=24 && !/[～〜]/.test(t); };
function pickMode(d){
  const ms = Object.keys(MODES).filter(m => m!=='spell' || canSpell(d));
  return ms[wpick(ms, m=>{ const x=st(d.id,m); return x.s ? (1-x.c/x.s)+.25 : .6; })];
}
function startQuiz(pool, o){
  if(!pool.length) return;
  let rest = [...pool], picked = [];
  const n = Math.min(o.n, rest.length);
  while(picked.length<n){
    const i = o.prio==='weak' ? wpick(rest, d=>{ const a=accOf(itemAgg(d.id)); return a===null?1.6:1+3*(1-a); }) : Math.floor(Math.random()*rest.length);
    picked.push(rest.splice(i,1)[0]);
  }
  const qs = picked.map(d=>{
    let mode = o.mode==='mix' ? pickMode(d) : o.mode;
    if(mode==='spell' && !canSpell(d)) mode='en2ja';
    const q = {d,mode};
    if(mode==='spell'){ q.sp = mkTiles(d); q.placed = []; }
    if(mode!=='spell'){
      const others = D.filter(x=>x.id!==d.id && x.type===d.type && x.ja!==d.ja && x.en!==d.en)
        .sort(()=>Math.random()-.5).sort((a,b)=>(a.lv===d.lv?0:1)-(b.lv===d.lv?0:1)).slice(0,3);
      const key = mode==='ja2en' ? 'en' : 'ja';
      q.choices = [...others.map(x=>({t:x[key],ok:false})), {t:d[key],ok:true}].sort(()=>Math.random()-.5);
    }
    return q;
  });
  Q = { qs, i:0, correct:0, wrong:[], done:false, ans:null, t0:Date.now(), bm:{}, answers:[], sess:null };
  document.getElementById('quiz').classList.add('open');
  renderQ();
}
function closeQuiz(){
  if(Q && Q.answers.length && !Q.sess){ Q.sess = mkSess(); sendSession(Q.sess); }   // 途中で終えても1問以上あれば保存
  document.getElementById('quiz').classList.remove('open'); try{speechSynthesis.cancel();}catch(e){} Q=null; render();
}

// スペルは並び替え：1語は文字タイル、2語以上（熟語・イディオム）は単語タイル。例文があれば例文の語句（活用形）を並べる
function mkTiles(d){
  const target = exSpan(d) || d.en;
  const words = target.split(' ').filter(Boolean), unit = words.length>1 ? 'word' : 'char';
  const parts = unit==='word' ? words : target.split('').filter(c=>/[A-Za-z0-9]/.test(c));
  let order = parts.map((_,i)=>i);
  for(let t=0; t<10; t++){
    order.sort(()=>Math.random()-.5);
    if(parts.length<2 || order.some((v,i)=>parts[v]!==parts[i])) break;   // 元の並びのままにしない
  }
  return { unit, parts, order, target };
}
function place(i){ const q = Q.qs[Q.i]; if(Q.ans!==null || q.placed.includes(i)) return; q.placed.push(i); renderQ(true); }
function unplace(k){ const q = Q.qs[Q.i]; if(Q.ans!==null) return; q.placed.splice(k,1); renderQ(true); }
function clearTiles(){ const q = Q.qs[Q.i]; if(Q.ans!==null) return; q.placed = []; renderQ(true); }
function tilesHtml(q){
  const sp = q.sp, done = Q.ans!==null;
  const slots = sp.parts.map((_,k)=>{
    if(q.placed[k]===undefined) return `<span class="tile slot"></span>`;
    const t = esc(sp.parts[q.placed[k]]);
    return done ? `<span class="tile ${Q.ans.ok?'ok':'ng'}">${t}</span>` : `<button class="tile on" aria-label="もどす" onclick="unplace(${k})">${t}</button>`;
  }).join('');
  if(done) return `<div class="tiles ans">${slots}</div>`;
  const pool = sp.order.map(i=> q.placed.includes(i) ? `<span class="tile used">${esc(sp.parts[i])}</span>` : `<button class="tile" onclick="place(${i})">${esc(sp.parts[i])}</button>`).join('');
  const full = q.placed.length===sp.parts.length;
  return `<div class="tiles ans">${slots}</div><div class="tiles">${pool}</div>
    <div class="row2"><button class="btn btn-sub" onclick="clearTiles()">やりなおす</button>
    <button class="btn btn-main" ${full?'':'disabled style="opacity:.45"'} onclick="submitSpell()">こたえる</button></div>`;
}

function renderQ(keepScroll){

      ${!ok && q.mode==='spell' ? `<div class="sub" style="margin-top:6px">あなたの答え：${esc(Q.ans.val||'（空）')}</div>`:''}

      <div class="row2"><button class="btn btn-sub" onclick="speakId(${d.id})">🔊 きく</button>
      <button class="btn btn-main" onclick="nextQ()">${Q.i+1>=Q.qs.length?'けっかを見る':'つぎへ'}</button></div>`;

function choiceHtml(q){
  return q.choices.map((c,i)=>{
    let cls = '', dis = '';
    if(Q.ans!==null){ dis='disabled'; if(c.ok) cls='ok'; else if(Q.ans.idx===i) cls='ng'; }
    return `<button class="ch ${cls}" ${dis} onclick="pick(${i})">${esc(c.t)}</button>`;
  }).join('');
}
function record(d, mode, ok){
  Q.answers.push({ item_id:d.id, mode, correct:ok });   // 保存は終了時に submit_session で1回だけ
  (Q.bm[mode] = Q.bm[mode]||[0,0])[0]++; if(ok) Q.bm[mode][1]++;
  if(!ok) Q.wrong.push(d); else Q.correct++;
}
function pick(i){
  if(Q.ans!==null) return;
  const q = Q.qs[Q.i], ok = q.choices[i].ok;
  Q.ans = {ok, idx:i}; record(q.d, q.mode, ok); renderQ();
}
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function submitSpell(){
  if(Q.ans!==null) return;
  const q = Q.qs[Q.i];
  if(q.placed.length < q.sp.parts.length) return;
  const val = q.placed.map(i=>q.sp.parts[i]).join(q.sp.unit==='word' ? ' ' : '');
  const ok = norm(val)===norm(q.sp.target);
  Q.ans = {ok, val}; record(q.d, 'spell', ok); renderQ();
}
function nextQ(){ Q.i++; Q.ans=null; renderQ(); }
function renderResult(){

  <button class="btn btn-sub" onclick="closeQuiz();go('home')">ホームへ</button></div>`;
}

/* ============ ロードマップ画面 ============ */
function curCard(){

function startLevel(l){ const pool = D.filter(d=>d.lv===l); startQuiz(pool,{mode:'mix',n:Math.min(10,pool.length),prio:'weak'}); }
function startStage(l,t){ const pool = D.filter(d=>d.lv===l && d.theme===t); startQuiz(pool,{mode:'mix',n:Math.min(10,pool.length),prio:'weak'}); }
function levelCard(l, cur){
  const x = lvStat(l), done = !!(S.cleared&&S.cleared[l]), open = isOpen(l), isCur = l===cur;
  const meta = `<div class="ttl"><b>${LVN[l]}</b><span>${LVDESC[l]}・${x.n ? x.n+'語' : 'じゅんび中'}</span></div>`;
  if(!x.n && !done) return `<div class="rc ${isOpen(l)?'':'lock'}" style="--c:var(--lv${l})">${meta}
    <div class="need" style="margin:6px 0 0">この級の単語は じゅんび中です</div></div>`;
  if(done) return `<div class="rc" style="--c:var(--lv${l})">${meta}
    <div class="gl" style="margin-top:6px"><span>クリア済み ✓</span><span>正答率 ${Math.floor(x.acc*100)}%</span></div>
    <button class="btn btn-sub" style="min-height:44px;padding:8px" onclick="startLevel(${l})">ふくしゅうする</button>${missBtn(l)}</div>`;
  if(!open) return `<div class="rc lock" style="--c:var(--lv${l})">${meta}
    <div class="need" style="margin:6px 0 0">🔒 ${LVN[LVORD[LVORD.indexOf(l)-1]]}をクリアすると解放されます</div></div>`;
  const themes = THEMES.map(t=>({t, ...stageStat(l,t)})).filter(o=>o.n>0);
  const parts = [];
  if(x.done<x.n) parts.push(`あと${x.n-x.done}語を${REQ[l]}回正解する`);
  if(x.acc<GATE) parts.push(`正答率をあと${Math.max(1,Math.ceil(GATE*100-x.acc*100))}%`);
  return `<div class="rc cur" ${isCur?'id="cur"':''} style="--c:var(--lv${l})">${meta}
    <div class="gate"><i style="width:${x.acc*100}%"></i><b></b></div>
    <div class="gl"><span>正答率 ${Math.floor(x.acc*100)}%</span><span>クリアライン ${Math.round(GATE*100)}%</span></div>
    <div class="gl" style="margin-top:0"><span>${REQ[l]}回以上正解した語</span><span>${x.done} / ${x.n}</span></div>
    <div class="need">${parts.length?'クリアまで：'+parts.join('、'):'クリア条件をみたしました！ 次の練習で判定されます'}</div>
    <div class="stages">${themes.map(o=>`<button class="stg ${o.ok?'ok':''}" onclick="startStage(${l},'${o.t}')">${o.ok?'✓ ':''}${o.t} <small>${o.n}</small></button>`).join('')}</div>
    <button class="btn btn-main" onclick="startLevel(${l})">${LVN[l]}を れんしゅう</button>${missBtn(l)}</div>`;
}
function vRoadmap(){
  const cur = curLv(), rows = [...LVORD].reverse();
  const nodes = rows.map((l,i)=>{
    const idx = LVORD.indexOf(l), done = !!(S.cleared&&S.cleared[l]), isCur = l===cur;
    const below = idx>0 ? LVORD[idx-1] : null;
    const trav = below!==null && S.cleared && S.cleared[below];
    return `<div class="rd ${i===rows.length-1?'last':''} ${trav?'trav':''}"><div class="node ${done?'done':isCur?'cur':''}">${done?'✓':isOpen(l)?'★':'🔒'}</div>${levelCard(l,cur)}</div>`;
  }).join('');
  return `<h1>ロードマップ</h1>
  <p class="sub">各級の全単語を正解して（${REQTXT}）、正答率${Math.round(GATE*100)}%にすると、次の級が解放されます。下の5級からスタート。</p>
  <div class="road"><div class="sub" style="margin:0 0 10px 54px">🏁 ゴール：英検準1級</div>${nodes}
    <div class="sub" style="margin-left:54px">🚩 スタート：英検5級</div></div>
`;
}


/* ============ 週間レポート ============ */
const DOW = ['日','月','火','水','木','金','土'];
const JST = 9*3600e3;   // 日付の表示と集計は JST
const ymd = (d=new Date()) => new Date(d.getTime()+JST).toISOString().slice(0,10);
const daysAgo = n => new Date(Date.now()-n*86400e3);
const jmd = d => { const j=new Date(d.getTime()+JST); return (j.getUTCMonth()+1)+'/'+j.getUTCDate(); };
function weekAgg(a,b){
  const set = new Set(); for(let i=a;i<=b;i++) set.add(ymd(daysAgo(i)));
  let n=0,c=0,sec=0; const days=new Set(), bm={};
  for(const x of (S.sessions||[])){
    if(!set.has(x.d)) continue;
    n+=x.n; c+=x.c; sec+=x.sec; days.add(x.d);
    for(const m in (x.bm||{})){ (bm[m]=bm[m]||[0,0]); bm[m][0]+=x.bm[m][0]; bm[m][1]+=x.bm[m][1]; }
  }
  return { n, c, sec, days:days.size, acc:n?c/n:null, bm };
}
function dayBars(){
  return [6,5,4,3,2,1,0].map(i=>{ const dt=daysAgo(i), k=ymd(dt); let n=0; (S.sessions||[]).forEach(x=>{ if(x.d===k) n+=x.n; });
    return { dow:DOW[new Date(dt.getTime()+JST).getUTCDay()], md:jmd(dt), n }; });
}
function streak(){
  const have = new Set((S.sessions||[]).map(x=>x.d)); let i = have.has(ymd())?0:1, n=0;
  while(have.has(ymd(daysAgo(i)))){ n++; i++; }
  return n;
}
function reportCard(){

    <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">📬 週間レポート</b>
    <span class="sub">${S.report&&((S.report.ch.mail&&S.report.email)||(S.report.ch.line&&S.report.lineLinked))?'送信先 設定ずみ':'送信先 未設定'} ›</span></div>
    <div class="sub" style="margin-top:2px">直近7日：${tw.days}日学習・${tw.n}問・${Math.round(tw.sec/60)}分</div></button>`;
}
const okMail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
// 週間レポートの設定（report_settings）と最近の送信（report_logs）を読む
async function loadReport(){
  if(!sb || !CHILD) return;
  const [s, l] = await Promise.all([
    sb.from('report_settings').select('enabled,email,email_enabled,line_enabled,dow,hour').eq('child_id',CHILD.id).maybeSingle(),
    sb.from('report_logs').select('kind,channel,status,created_at').eq('child_id',CHILD.id).order('created_at',{ascending:false}).limit(5)
  ]);

  const R = repDef();
  if(s.data) Object.assign(R, { exists:true, on:s.data.enabled, email:s.data.email||'', dow:s.data.dow, hour:s.data.hour, ch:{ mail:s.data.email_enabled, line:!!(FEATURES.line && s.data.line_enabled) } });
  R.log = (l.data||[]).map(x=>({ t:new Date(x.created_at).getTime(), kind:x.kind==='auto'?'自動':'手動', to:(x.channel==='email'?'メール':'LINE')+(x.status==='sent'?'':'（失敗）') }));
  S.report = R;
}
async function openReport(){

// 設定を report_settings に保存（クライアントが書ける列だけ。line_user_id / last_sent_at は触らない）
async function saveReport(silent){
  const R=S.report, v=readMail();
  if(!R.ch.mail && !R.ch.line){ setRmsg('おくり先を1つ以上えらんでください',false); return false; }
  if(R.ch.mail && !okMail(v)){ setRmsg('メールアドレスの形式を確認してください',false); return false; }
  if(R.ch.mail) R.email=v;
  if(isOffline()){ setRmsg('オフラインのため保存できません。つながってから、もう一度おしてください',false); return false; }
  const row = { enabled:!!R.on, email:R.email||null, email_enabled:!!R.ch.mail, line_enabled:!!R.ch.line, dow:R.dow, hour:R.hour };
  const res = R.exists
    ? await sb.from('report_settings').update({ ...row, updated_at:new Date().toISOString() }).eq('child_id', CHILD.id)
    : await sb.from('report_settings').insert({ child_id:CHILD.id, ...row });
  if(res.error){ console.error(res.error); setRmsg('保存できませんでした。もう一度ためしてください',false); return false; }
  R.exists = true;
  if(!silent){ renderReport(); setRmsg('保存しました',true); }
  return true;

// 「今すぐ送信」：先に設定を保存してから Edge Function（send-weekly-report）を呼ぶ
async function sendNow(){
  if(UI.sending) return;
  if(!(await saveReport(true))) return;
  UI.sending = true; setRmsg('送信しています…', true);
  try{
    const { data, error } = await sb.functions.invoke('send-weekly-report', { body:{ child_id:CHILD.id } });
    if(error){ let code = ''; try{ code = (await error.context.json()).error || ''; }catch(e){} throw Object.assign(new Error(code || error.message), { code }); }
    const r = (data && data.results && data.results.results) || [];
    try{ await loadReport(); }catch(e){}
    renderReport();
    if(!r.length) setRmsg('おくり先が設定されていません', false);
    else if(r.every(x=>x.status==='sent')) setRmsg('送信しました。メールを確認してください（届くまで数分かかることがあります）', true);
    else setRmsg('送信できませんでした：' + String((r.find(x=>x.status!=='sent')||{}).error||'').slice(0,120), false);
  }catch(e){
    console.error(e);
    setRmsg(e.code==='rate_limited' ? '今日はもう送信できません（1日3回まで）' : '送信できませんでした。通信を確かめて、もう一度ためしてください', false);
  }
  UI.sending = false;
}

function buildSummary(lv){
  const cells=[];
  for(const t of THEMES) for(const m in MODES){ const x=cellAgg(t,m,lv); if(x.s) cells.push({theme:t,mode:m,attempts:x.s,accuracy:pct(x.c/x.s)}); }
  const modes={}; for(const m in MODES){ const x=cellAgg(null,m,lv); modes[m]= x.s?{attempts:x.s,accuracy:pct(x.c/x.s)}:null; }
  const types={}; for(const k in TYPES){ let s=0,c=0; for(const d of filt(lv)) if(d.type===k) for(const m in MODES){const x=st(d.id,m);s+=x.s;c+=x.c;} types[k]= s?{attempts:s,accuracy:pct(c/s)}:null; }
  const levels={}; for(const l of LVORD){ if(lv!=='all'&&lv!=l) continue; const it=D.filter(d=>d.lv===l); let s=0,c=0; it.forEach(d=>{const x=itemAgg(d.id);s+=x.s;c+=x.c;});
    levels[LVN[l]]={status:S.cleared[l]?'クリア済み':isOpen(l)?'挑戦中':'未解放',words:it.length,mastered:it.filter(mastered).length,untouched:it.filter(d=>!itemAgg(d.id).s).length,accuracy:s?pct(c/s):null}; }
  const worst = filt(lv).map(d=>({d,x:itemAgg(d.id)})).filter(o=>o.x.s>=3).sort((a,b)=>a.x.c/a.x.s-b.x.c/b.x.s).slice(0,8)
    .map(({d})=>({en:d.en,ja:d.ja,level:LVN[d.lv],type:TYPES[d.type],theme:d.theme,byMode:Object.fromEntries(Object.keys(MODES).filter(m=>st(d.id,m).s).map(m=>[m,st(d.id,m).c+'/'+st(d.id,m).s]))}));
  return {scope: lv==='all'?'全級':LVN[lv], cells, modes, types, levels, worstWords:worst};
}
function aiPrompt(lv){
  return `あなたは小学生向け英検対策（5級〜準1級）の学習コーチです。このアプリは、各級を「全語を正解（5〜3級は1回、準2級〜準1級は2回）し、正答率90%以上」でクリアしないと次の級に進めない仕組みです。以下は、ある小学生の英単語アプリの回答データです。保護者がスマホで読む前提で、弱点を分析してください。

【データの見方】
- theme＝単語のテーマ、mode＝問題の形（en2ja=英語→日本語の意味、ja2en=日本語→英語を選ぶ、spell=つづりを書く）
- accuracy＝正答率(%)、attempts＝挑戦回数。attemptsが5未満のマスは断定せず「まだ判断できない」扱いにする
- byMode は "正解数/挑戦数"
- 数字は必ずこのデータにあるものだけを使う。推測で作らない

【ルール】
- 日本語。やさしく具体的に。責める表現は使わない
- 弱点は最大3つ。「どのテーマ×どの問題の形か」「何が起きていそうか（例：意味は分かるが書けない）」「家庭でできる具体策」をセットで
- 練習プランは最大3つ。theme は ${THEMES.join('/')} のいずれか、mode は en2ja/ja2en/spell のいずれか
- childMessage は小学生本人向けのひとこと（ひらがな多め、40字以内、前向きに）

【出力】JSONのみ。形式：
{"headline":"全体を一言で（30字以内）","summary":"保護者向け2〜3文","weaknesses":[{"theme":"うごき","mode":"spell","finding":"…","tip":"…"}],"strengths":["…"],"plan":[{"theme":"うごき","mode":"spell","reason":"…"}],"childMessage":"…"}

【データ】
${JSON.stringify(buildSummary(lv))}`;
}

async function fetchAll(build){
  const out = [];
  for(let from=0;; from+=1000){
    const { data, error } = await build(from, from+999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}
async function loadVocab(){
  const rows = await fetchAll((a,b)=>sb.from('vocab_items').select('id,level,en,ja,type,theme,example_en,example_ja').eq('active',true).order('id').range(a,b));
  D = rows.filter(r=>LV_FROM_DB[r.level]).map(r=>({ id:r.id, en:r.en, ja:r.ja, lv:LV_FROM_DB[r.level], type:r.type, theme:r.theme, ex:r.example_en||'', exj:r.example_ja||'' }));
  if(!D.length) throw new Error('no vocab');
  const have = new Set(D.map(d=>d.theme));
  THEMES = [...THEME_ORDER.filter(t=>have.has(t)), ...[...have].filter(t=>!THEME_ORDER.includes(t)).sort()];
}
// まだ送れていない結果を、画面用の状態（S）に足す（サーバーの値 ＋ 未送信ぶん）
function applyLocal(answers){
  const bm = {}, wrong = [];
  for(const a of answers){
    const m = (S.stats[a.item_id] = S.stats[a.item_id] || {}), x = (m[a.mode] = m[a.mode] || { s:0, c:0 });
    x.s++; if(a.correct) x.c++; else wrong.push(a.item_id);
    (bm[a.mode] = bm[a.mode] || [0,0])[0]++; if(a.correct) bm[a.mode][1]++;
  }
  S.today += answers.length;
  S.sessions.push({ d:ymd(), n:answers.length, c:answers.filter(a=>a.correct).length, sec:0, bm });
  S.recent = [...new Set([...wrong.reverse(), ...S.recent])].filter(id=>byId(id)).slice(0,12);
}

    sb.from('level_progress').select('level').eq('child_id',cid),
    sb.from('study_sessions').select('started_at,question_count,correct_count,duration_sec,by_mode').eq('child_id',cid).gte('started_at',since).order('started_at',{ascending:false}).limit(1000),
    sb.from('answer_logs').select('item_id').eq('child_id',cid).eq('correct',false).order('answered_at',{ascending:false}).limit(40)
  ]);
  for(const r of [prog,sess,wrong]) if(r.error) throw r.error;
  const bag = {};
  for(const r of stats){ (bag[r.item_id] = bag[r.item_id]||{})[r.mode] = { s:r.seen, c:r.correct }; }
  const srv = { stats:bag, cleared:{}, sessions:[], today:0, recent:[] };
  for(const r of prog.data){ const l = LV_FROM_DB[r.level]; if(l) srv.cleared[l] = true; }
  srv.sessions = sess.data.map(r=>({ d:ymd(new Date(r.started_at)), n:r.question_count, c:r.correct_count, sec:r.duration_sec, bm:r.by_mode||{} }));
  srv.today = srv.sessions.filter(x=>x.d===ymd()).reduce((a,x)=>a+x.n,0);
  const seen = new Set();
  for(const r of wrong.data){
    if(seen.has(r.item_id) || !byId(r.item_id)) continue;
    seen.add(r.item_id); srv.recent.push(r.item_id);
    if(srv.recent.length >= 12) break;
  }
  saveSnap(srv);                 // 端末には「サーバーの値」だけを保存する
  Object.assign(S, srv);
  PENDING.forEach(s=>applyLocal(s.answers));
}
function mkSess(){
  const s = { id:Date.now()+'-'+Math.random().toString(36).slice(2,8), started:new Date(Q.t0).toISOString(), answers:Q.answers.slice(), state:'new', newly:[] };
  PENDING.push(s); persistPending(); applyLocal(s.answers);   // 端末に残してから送る
  return s;
}
// クイズ1回分を submit_session で保存。送れなければ端末に残して、つながったら再送する
async function sendSession(s){
  if(s.state==='saving' || s.state==='done') return;
  s.state = 'saving';
  try{
    if(!navigator.onLine || !sb) throw Object.assign(new Error('offline'), { offline:true });
    if(s.resumed || s.tried){   // 前回の送信が届いていないか、先に確かめる（二重記録の防止）
      const dup = await sb.from('study_sessions').select('id').eq('child_id',CHILD.id).eq('started_at',s.started).limit(1);
      if(!dup.error && dup.data.length){ s.state = 'done'; s.newly = []; }
    }
    if(s.state!=='done'){
      s.tried = true;
      const { data, error } = await sb.rpc('submit_session', { p_child:CHILD.id, p_started:s.started, p_answers:s.answers });
      if(error) throw error;
      s.newly = ((data && data.newly_cleared) || []).map(c=>LV_FROM_DB[c]).filter(Boolean);
      s.state = 'done';
    }
    PENDING = PENDING.filter(x=>x!==s); persistPending();
    OFFLINE = false;
  }catch(e){
    console.error('submit_session failed', e);
    s.state = 'error'; s.offline = !!(e && e.offline) || isNetErr(e);
    if(s.offline) OFFLINE = true;
  }
  if(s.state==='done'){ try{ await refreshData(); }catch(e){ console.error('refresh failed', e); } }
  if(Q && Q.sess===s) renderResult();
  render();
}
async function flushPending(){
  for(const s of [...PENDING]) await sendSession(s);
  render();
}
// つながったとき・アプリに戻ったときに、未送信の結果を送って最新データを読み直す
async function syncNow(){
  if(SYNCING || !CHILD) return;
  if(!sb){ if(!Q && navigator.onLine) location.reload(); return; }
  if(!navigator.onLine) return;
  SYNCING = true;
  try{
    if(PENDING.length) await flushPending();
    if(OFFLINE && !PENDING.length){ await refreshData(); OFFLINE = false; }
  }catch(e){ console.error('sync failed', e); }
  SYNCING = false; render();
}
function offlineBar(){
  if(!isOffline()) return '';
  const n = PENDING.filter(s=>s.state!=='saving').length;
  return `<div class="subj" style="margin-top:12px">📴 オフラインです。クイズは解けます。結果は端末に保存して、つながったら自動で送ります。${n?`（まだ送れていない結果：${n}回分）`:''}</div>`;
}
function pendingCard(){
  const n = PENDING.filter(s=>s.state!=='saving').length;
  if(!n || isOffline()) return '';
  return `<div class="fb ng" style="margin-top:12px"><div class="t">保存できていない結果があります（${n}回分）</div>
    <div class="sub">通信を確かめて、もう一度おくってください。</div>
    <button class="btn btn-main" style="min-height:44px;padding:8px;margin-top:8px" onclick="flushPending()">もう一度おくる</button></div>`;
}

/* ============ ログイン（ログインID＋PIN） ============ */
const gate = on => document.body.classList.toggle('gate', on);
function showFatal(msg){
  gate(true);
  document.getElementById('app').innerHTML = `<h1 style="margin-top:28px">えいたんレーダー</h1>
    <div class="empty">${esc(msg)}</div>
    <button class="btn btn-main" onclick="boot()">もう一度</button>
    ${sb ? `<div style="text-align:center;margin-top:14px"><button onclick="logout()" style="min-height:44px;padding:0 12px;font-size:12px;color:var(--ink3);text-decoration:underline">ログアウト</button></div>` : ''}`;
}
function showAuth(mode, msg){
  gate(true);
  const su = mode==='signup';
  document.getElementById('app').innerHTML = `
  <h1 style="margin-top:28px">えいたんレーダー</h1>
  <p class="sub">英検5級〜準1級。苦手を見つけて、つぶして、次の級へ。</p>
  <div class="repbox" style="margin-top:20px"><h3>${su?'はじめて使う':'ログイン'}</h3>
    <label class="lbl" for="aid">ログインID（半角の英小文字・数字、3〜20字）</label>
    <input id="aid" class="fld" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" maxlength="20">
    <label class="lbl" for="apin">PIN（数字6けた以上）</label>
    <input id="apin" class="fld" type="password" inputmode="numeric" autocomplete="${su?'new-password':'current-password'}" maxlength="12" onkeydown="if(event.key==='Enter')submitAuth('${mode}')">
    <div class="need" id="amsg" style="margin:10px 0;color:var(--bad)">${esc(msg||'')}</div>
    <button class="btn btn-main" id="abtn" onclick="submitAuth('${mode}')">${su?'アカウントを作る':'ログイン'}</button>
    <div style="height:10px"></div>
    <button class="btn btn-sub" onclick="showAuth('${su?'login':'signup'}')">${su?'もうアカウントがある':'はじめて使う（アカウントを作る）'}</button>
    ${su?'<p class="sub" style="margin-top:12px">PINをわすれても、再設定はできません。メモしておいてください。</p>':''}
  </div>`;
  window.scrollTo(0,0);
}
function authMsg(e, mode){
  const m = String((e && e.message) || '').toLowerCase(), code = (e && e.code) || '';
  if(code==='invalid_credentials' || m.includes('invalid login')) return 'IDかPINがちがいます';
  if(code==='user_already_exists' || m.includes('already registered')) return 'このIDはすでに使われています。べつのIDにしてください';
  if(code==='weak_password') return 'PINがかんたんすぎます。べつの数字にしてください';
  if(code==='over_request_rate_limit' || (e && e.status===429)) return 'しばらくしてから、もう一度ためしてください';
  if(e && (e.name==='AuthRetryableFetchError' || m.includes('fetch'))) return '通信できませんでした。ネットにつながっているか確かめてください';
  return (mode==='signup' ? 'アカウントを作れませんでした' : 'ログインできませんでした') + '（' + (code || (e && e.status) || 'error') + '）';
}
async function submitAuth(mode){
  const id = document.getElementById('aid').value.trim().toLowerCase(), pin = document.getElementById('apin').value;
  const msg = t => { const e = document.getElementById('amsg'); if(e) e.textContent = t; };
  if(!/^[a-z0-9]{3,20}$/.test(id)) return msg('ログインIDは、半角の英小文字・数字で3〜20字にしてください');
  if(!/^[0-9]{6,}$/.test(pin)) return msg('PINは、数字6けた以上にしてください');
  const btn = document.getElementById('abtn'); btn.disabled = true; msg('');
  const creds = { email:id+'@eitan-radar.invalid', password:pin };
  try{
    const res = mode==='signup' ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
    if(res.error) throw res.error;
    if(!res.data.session) throw new Error('no session');
    await startApp(res.data.session.user);
  }catch(e){ console.error(e); btn.disabled = false; msg(authMsg(e, mode)); }
}
function showNameForm(msg){
  gate(true);
  document.getElementById('app').innerHTML = `
  <h1 style="margin-top:28px">はじめまして</h1>
  <p class="sub">お子さまの名前を入れてください（ひらがなでもOK）。</p>
  <div class="repbox" style="margin-top:20px">
    <label class="lbl" for="nm" style="margin-top:0">なまえ</label>
    <input id="nm" class="fld" type="text" maxlength="30" autocomplete="off" onkeydown="if(event.key==='Enter')submitName()">
    <div class="need" id="nmsg" style="margin:10px 0;color:var(--bad)">${esc(msg||'')}</div>
    <button class="btn btn-main" id="nbtn" onclick="submitName()">はじめる</button>
  </div>`;
  window.scrollTo(0,0);
}
async function submitName(){
  const v = document.getElementById('nm').value.trim();
  const msg = t => { const e = document.getElementById('nmsg'); if(e) e.textContent = t; };
  if(!v) return msg('なまえを入れてください');
  const btn = document.getElementById('nbtn'); btn.disabled = true; msg('');
  const { error } = await sb.from('children').insert({ parent_id:USER.id, name:v });
  if(error){ console.error(error); btn.disabled = false; return msg('保存できませんでした。もう一度ためしてください'); }
  await startApp(USER);
}
// 通信できないとき：端末に保存した直前のデータで開く（ログイン中の端末だけ）
function offlineStart(uid){
  const snap = readSnap(uid);
  if(!snap || !authKeys().length) return false;
  USER = { id:snap.userId }; CHILD = snap.child; D = snap.D; THEMES = snap.THEMES;
  Object.assign(S, snap.S);
  loadPending(); PENDING.forEach(s=>applyLocal(s.answers));
  OFFLINE = true; gate(false);
  C.lv = [curLv() || 5]; UI.tab = 'home';
  render(); window.scrollTo(0,0);
  return true;
}
async function startApp(user){
  USER = user;
  try{
    const r = await sb.from('children').select('id,name').order('created_at').limit(1);
    if(r.error) throw r.error;
    if(!r.data.length) return showNameForm();
    CHILD = r.data[0]; loadPending();
    await loadVocab();
    await refreshData();
    if(FEATURES.report){ try{ await loadReport(); }catch(e){ console.error('report settings', e); } }
  }catch(e){
    console.error(e);
    if(offlineStart(user.id)) return;
    return showFatal('データを読みこめませんでした。通信を確かめて、もう一度ためしてください。');
  }
  OFFLINE = false; gate(false);
  C.lv = [curLv() || 5]; UI.tab = 'home';
  render(); window.scrollTo(0,0);
  syncNow();   // 前回送れなかった結果があれば送る
}
async function logout(){
  if(PENDING.length && !confirm('保存できていない結果があります。ログアウトすると失われます。ログアウトしますか？')) return;
  if(CHILD){ lsDel(pendKey()); }
  lsDel(SNAP_KEY);
  try{ await sb.auth.signOut(); }catch(e){}
  authKeys().forEach(k=>lsDel(k));   // 通信できなくても、この端末のログインは必ず消す
  location.reload();
}
async function boot(){
  gate(true);
  document.getElementById('app').innerHTML = '<div class="empty">よみこみ中…</div>';
  if(!sb && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
  const offMsg = '通信できませんでした。電波のよいところで、もう一度ひらいてください。';
  if(!sb){ if(!offlineStart()) showFatal(offMsg); return; }
  let r;
  try{ r = await sb.auth.getSession(); }catch(e){ r = { error:e }; }
  if(r.error){ if(!offlineStart()) showFatal(offMsg); return; }
  if(!r.data.session) return showAuth('login');
  await startApp(r.data.session.user);
}
window.addEventListener('online', syncNow);
window.addEventListener('offline', () => { if(!document.body.classList.contains('gate') && !Q) render(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && (PENDING.length || OFFLINE)) syncNow(); });
if('serviceWorker' in navigator){
  // 新しい版の Service Worker が有効になったら、1回だけ読み直して最新の画面にする（初回インストール時とクイズ中は読み直さない）
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadSW || reloaded || Q) return;
    reloaded = true; location.reload();
  });
  navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).catch(()=>{});
}
boot();
</script>
